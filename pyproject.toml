[project]
name = "tiktok-ai-swarm"
version = "0.1.0"
description = "Autonomous AI TikTok influencer — 24/7 content creation, posting, live streaming, and engagement"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
    "schedule>=1.2",
    "ffmpeg-python>=0.2",
]

[project.optional-dependencies]
voice = ["elevenlabs>=1.0"]
avatar = ["replicate>=0.25"]
full = ["elevenlabs>=1.0", "replicate>=0.25"]
dev = ["pytest>=8.0"]

[project.scripts]
tt = "tiktok_swarm.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
